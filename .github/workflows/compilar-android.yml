name: Compilar TÚAquiler Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android
        uses: android-actions/setup-android@v4
      - name: Instalar Android 16 API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verificar versión del código subido
        run: |
          echo "Commit actual: $GITHUB_SHA"
          grep -E 'versionCode|versionName' app/build.gradle
          head -n 1 app/src/main/assets/app.js
          grep -F "const BUILD_TAG='2.9.1'" app/src/main/assets/app.js

      - name: Generar APK de prueba
        run: gradle --no-daemon :app:assembleDebug

      - name: Renombrar APK con versión y commit
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk "entrega/TUAquiler-v2.9.1-${GITHUB_SHA:0:7}-debug.apk"
      - name: Descargar APK desde Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TUAquiler-v2.9.1-${{ github.sha }}
          path: entrega/TUAquiler-v2.9.1-*-debug.apk
          if-no-files-found: error
